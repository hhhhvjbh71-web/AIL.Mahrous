<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1D63C4">
<title>You're Offline — Mr. Ali Mahrous</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Tajawal', 'Inter', Arial, sans-serif;
    background: linear-gradient(165deg, #0B1220 0%, #0F1F3D 45%, #0A1830 100%);
    color: #F8FAFC;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { text-align: center; padding: 32px; max-width: 420px; }
  .icon-badge {
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 22px;
    background: radial-gradient(circle at 30% 30%, #3E86DE, #164E9E 60%, #091F40 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 20px; margin: 0 0 10px; color: #FFD53D; }
  p { font-size: 14.5px; line-height: 1.7; color: #9FB6DE; margin: 0 0 24px; }
  button {
    background: linear-gradient(135deg, #3E86DE, #1D63C4);
    color: #fff; border: none; padding: 12px 26px; border-radius: 12px;
    font-size: 14.5px; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 20px rgba(29,99,196,.35);
  }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon-badge">📡</div>
    <h1>You're Offline</h1>
    <p>It looks like there's no internet connection right now. Please check your connection and try again — your courses and data are safe.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
